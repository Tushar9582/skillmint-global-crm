services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillmint
      POSTGRES_PASSWORD: skillmint_local_password
      POSTGRES_DB: skillmint
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - skillmint_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U skillmint']
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  skillmint_pg:
